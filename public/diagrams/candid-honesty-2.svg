<svg width="640" height="180" viewBox="0 0 640 180" role="img"
     aria-label="애매한 업무를 완료로 확정하지 않고 확인 큐로 넘기는 도식. 확인 큐 색 #6E6A86, 색+아이콘+라벨 3중 병기. 통제된 환경에서 거짓완료는 0건."
     xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="180" fill="#DCE8EC" rx="12"/>
  <!-- 애매한 업무 카드(가운데) -->
  <rect x="230" y="30" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#8A93A0" stroke-width="1.5"/>
  <text x="320" y="55" fill="#12303A" font-size="13" text-anchor="middle">끝났나…? 애매한 일</text>
  <text x="320" y="73" fill="#8A93A0" font-size="11" text-anchor="middle">예시·데모 데이터</text>
  <!-- 두 갈래: 완료로 지르지 않음(막힘) / 확인 큐로(허용) -->
  <!-- 왼쪽: 완료로 새지 않음 -->
  <g stroke="#A9C2CB" stroke-width="1.4" stroke-dasharray="3 5" fill="none">
    <path d="M270 82 L150 130"/>
  </g>
  <rect x="70" y="130" width="150" height="34" rx="10" fill="none" stroke="#A9C2CB" stroke-width="1.4" stroke-dasharray="4 6"/>
  <text x="145" y="152" fill="#8A93A0" font-size="12" text-anchor="middle">완료로 지르지 않음</text>
  <!-- 오른쪽: 확인 큐로(정직함의 자리) -->
  <g stroke="#6E6A86" stroke-width="1.6" fill="none">
    <path d="M370 82 L470 130"/>
  </g>
  <rect x="420" y="130" width="160" height="34" rx="10" fill="#6E6A86"/>
  <!-- 아이콘: 다이아(◇) + 라벨(3중) -->
  <rect x="440" y="141" width="12" height="12" rx="2" transform="rotate(45 446 147)" fill="#FFFFFF"/>
  <text x="512" y="152" fill="#FFFFFF" font-size="12" text-anchor="middle">확인 큐 — 봐 주세요</text>
</svg>