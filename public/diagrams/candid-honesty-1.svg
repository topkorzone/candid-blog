<svg width="640" height="200" viewBox="0 0 640 200" role="img"
     aria-label="대화에 실제로 있는 업무만 카드로 떠오르고, 없는 일은 만들어지지 않는 도식. 통제된 환경에서 없는 일을 지어낸 오탐은 0~1건."
     xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="200" fill="#DCE8EC" rx="12"/>
  <!-- 아래: 실제 대화 조각(저채도, 흐릿) -->
  <g fill="#8A93A0" opacity="0.55">
    <rect x="40"  y="150" width="70" height="16" rx="8"/>
    <rect x="150" y="158" width="54" height="14" rx="7"/>
    <rect x="235" y="150" width="80" height="16" rx="8"/>
    <rect x="450" y="150" width="72" height="16" rx="8"/>
  </g>
  <!-- 위: 대화에 실제로 있던 업무만 카드로(잔잔히 부상) -->
  <g>
    <rect x="120" y="40" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2E6B7E" stroke-width="1.5"/>
    <circle cx="142" cy="62" r="5" fill="#3E7CA8"/>
    <text x="156" y="66" fill="#12303A" font-size="13">배포 점검 · 담당 K</text>
    <text x="156" y="86" fill="#6B7680" font-size="12">status: 진행중</text>
    <text x="310" y="55" fill="#8A93A0" font-size="10" text-anchor="end">예시·데모 데이터</text>
  </g>
  <!-- 없는 일은 만들어지지 않음: 빈 점선 자리(채워지지 않음) -->
  <g>
    <rect x="360" y="40" width="200" height="60" rx="10" fill="none" stroke="#A9C2CB" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="460" y="75" fill="#8A93A0" font-size="12" text-anchor="middle">대화에 없던 일 —</text>
    <text x="460" y="92" fill="#8A93A0" font-size="12" text-anchor="middle">지어내지 않음</text>
  </g>
  <!-- 부상 표현: 화살표 아닌, 위로 옅어지는 잔잔한 점선(떠오름=surface, 쏨=push 아님) -->
  <g stroke="#2E6B7E" stroke-width="1" stroke-dasharray="2 6" opacity="0.4">
    <line x1="220" y1="150" x2="220" y2="105"/>
  </g>
</svg>