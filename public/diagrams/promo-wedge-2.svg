<svg width="640" height="180" viewBox="0 0 640 180" role="img"
     aria-label="시간축을 따라 이어지는 업무 타임라인 위에서, 며칠째 움직이지 않은 항목 하나에 탈채도 앰버 배지가 조용히 켜지는 모습."
     xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="180" fill="#DCE8EC" rx="12"/>
  <!-- 시간축 -->
  <line x1="50" y1="120" x2="590" y2="120" stroke="#A9C2CB" stroke-width="1.5"/>
  <text x="50" y="150" fill="#8A93A0" font-size="11">월</text>
  <text x="185" y="150" fill="#8A93A0" font-size="11">화</text>
  <text x="320" y="150" fill="#8A93A0" font-size="11">수</text>
  <text x="455" y="150" fill="#8A93A0" font-size="11">목</text>
  <text x="585" y="150" fill="#8A93A0" font-size="11" text-anchor="end">금</text>
  <!-- 정상 진행 항목(진행중, 최근 움직임) -->
  <circle cx="455" cy="120" r="7" fill="#3E7CA8"/>
  <text x="455" y="100" fill="#6B7680" font-size="11" text-anchor="middle">배포 점검 · 진행중</text>
  <!-- 며칠째 안 움직인 항목: 탈채도 앰버 배지 조용히 켜짐(색+아이콘+라벨 3중) -->
  <circle cx="120" cy="120" r="7" fill="#B0803A"/>
  <g>
    <rect x="60" y="42" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#B0803A" stroke-width="1.5"/>
    <circle cx="82" cy="63" r="6" fill="#B0803A"/>
    <text x="98" y="68" fill="#7A5A28" font-size="13">약관 검토 · 정체</text>
    <text x="150" y="105" fill="#8A93A0" font-size="10" text-anchor="middle">예시·데모 데이터</text>
  </g>
  <!-- 마지막 움직임 이후 조용한 점선(움직임 없음을 조용히 표시·경보 아님) -->
  <line x1="120" y1="113" x2="120" y2="86" stroke="#B0803A" stroke-width="1" stroke-dasharray="2 5" opacity="0.55"/>
  <text x="320" y="30" fill="#4A6169" font-size="13" text-anchor="middle">며칠째 멈춘 일을, 빨간 경보 없이 조용히 먼저 떠올립니다</text>
</svg>